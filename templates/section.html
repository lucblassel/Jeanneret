{% extends "index.html" %} {% block content %}

<div class="post-list">
  <ul>
    {% for page in section.pages | reverse %}
    <li >
      <div class="post-list-item">
        <a href="{{ page.permalink }}">
          <h1>{{ page.title }}</h1>
        </a>
        <span>{{ page.date | date(format="%Y-%m-%d")}}</span>
      </div>
    </li>
    {% endfor %}
  </ul>
</div>

{% endblock %}
